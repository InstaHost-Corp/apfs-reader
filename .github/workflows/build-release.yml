name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            openssl_target: VC-WIN32
          - arch: x64
            openssl_target: VC-WIN64A
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - uses: microsoft/setup-msbuild@v2

      - name: Build static OpenSSL
        shell: pwsh
        run: |
          Invoke-WebRequest `
            https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz `
            -OutFile openssl.tar.gz
          tar -xzf openssl.tar.gz
          Set-Location openssl-1.1.1w
          perl Configure ${{ matrix.openssl_target }} no-shared no-tests `
            "--prefix=$env:GITHUB_WORKSPACE\openssl-${{ matrix.arch }}"
          nmake /nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          nmake /nologo install_sw
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build APFS backend
        shell: pwsh
        run: |
          cmake -S third_party/paragon_apfs_sdk_ce `
            -B build/backend-${{ matrix.arch }} -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENSSL_ROOT_DIR="$env:GITHUB_WORKSPACE\openssl-${{ matrix.arch }}" `
            -DOPENSSL_USE_STATIC_LIBS=TRUE `
            -DAPFSUTIL_FORCE_RO=TRUE `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/backend-${{ matrix.arch }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 `
            -Version 1.0.3 -OutputDirectory packages -DirectDownload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $frameworkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build"
          msbuild src/APFSReader/APFSReader.csproj /m `
            /p:Configuration=Release /p:Platform=${{ matrix.arch }} `
            "/p:TargetFrameworkRootPath=$frameworkRoot" /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run parser tests
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          & $csc /nologo /out:ParserTests.exe `
            tests/ParserTests.cs src/APFSReader/ApfsBackend.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ParserTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable release
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}".TrimStart("v")
          } else { "1.0.0-dev" }
          $name = "APFSReader-$version-win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Path "dist\$name" | Out-Null
          Copy-Item "src\APFSReader\bin\${{ matrix.arch }}\Release\APFSReader.exe" "dist\$name\"
          Copy-Item "build\backend-${{ matrix.arch }}\bin\apfs_backend.exe" "dist\$name\"
          Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md "dist\$name\"
          Compress-Archive -Path "dist\$name" -DestinationPath "dist\$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: APFSReader-win-${{ matrix.arch }}
          path: dist/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
